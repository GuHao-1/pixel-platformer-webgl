<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Plat former Game</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* 强制覆盖 Unity 默认的样式 */
      html, body {
        padding: 0 !important;
        margin: 0 !important;
        overflow: hidden !important;
        background-color: #000 !important; /* 黑边颜色 */
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      
      /* 强制容器保持 16:9 比例并居中 */
      #unity-container {
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        width: 100vw !important;
        height: 56.25vw !important; /* 100 / (16/9) = 56.25 */
        max-height: 100vh !important;
        max-width: 177.78vh !important; /* 100 / (9/16) = 177.78 */
      }
      
      /* 画布填满容器 */
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        background: #231F20;
      }
      
      /* 隐藏底部的 logo 栏，防止占用手机屏幕空间 */
      #unity-footer {
        display: none !important; 
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <!-- 全屏按钮移到了外部，或者用悬浮按钮 -->
      <div id="unity-footer" style="display: none !important;">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Plat former Game</div>
      </div>
    </div>

    <!-- 自定义悬浮全屏按钮 (只在全屏后可见) -->
    <button id="custom-fullscreen-btn" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; padding: 10px; background: rgba(255,255,255,0.5); border: none; border-radius: 5px; display: none;">全屏</button>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");
      var customBtn = document.querySelector("#custom-fullscreen-btn");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL_Build2_0.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGL_Build2_0.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL_Build2_0.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL_Build2_0.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Plat former Game",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
        customBtn.style.display = "block"; // 手机端显示自定义全屏按钮
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          
          // 绑定全屏逻辑
          var toggleFullscreen = () => {
            unityInstance.SetFullscreen(1).then(() => {
              if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(()=>{});
              }
            });
          };

          fullscreenButton.onclick = toggleFullscreen;
          customBtn.onclick = toggleFullscreen;
          
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
