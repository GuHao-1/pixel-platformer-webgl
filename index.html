<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Plat former Game</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* 清除默认样式，禁止手机触摸滑动 */
      html, body {
        padding: 0;
        margin: 0;
        overflow: hidden;
        touch-action: none;
        width: 100%;
        height: 100%;
        background: #231F20;
      }
      #unity-container {
        position: absolute;
        width: 100%;
        height: 100%;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #231F20;
      }

      /* 【核心新增】竖屏提示遮罩 */
      #orientation-warning {
        display: none; /* 默认隐藏 */
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: #1a1a1a;
        color: white;
        z-index: 9999; /* 确保在最上层 */
        justify-content: center;
        align-items: center;
        flex-direction: column;
        font-family: sans-serif;
        text-align: center;
      }
      #orientation-warning img {
        width: 100px;
        margin-bottom: 20px;
        animation: rotate 2s infinite ease-in-out;
      }
      @keyframes rotate {
        0% { transform: rotate(0deg); }
        50% { transform: rotate(90deg); }
        100% { transform: rotate(90deg); }
      }

      /* 当设备处于竖屏时（高度大于宽度），显示遮罩 */
      @media screen and (orientation: portrait) {
        #orientation-warning {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <!-- 竖屏遮罩层 -->
    <div id="orientation-warning">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M16 1H8C6.34 1 5 2.34 5 4v16c0 1.66 1.34 3 3 3h8c1.66 0 3-1.34 3-3V4c0-1.66-1.34-3-3-3zm-2 20h-4v-1h4v1zm3.25-3H6.75V4h10.5v14z'/></svg>" />
      <h2>请将手机横屏游玩</h2>
      <p>横屏体验更佳哦</p>
    </div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Plat former Game</div>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      // 注意你的文件名是 2_0，这里必须对应
      var loaderUrl = buildUrl + "/WebGL_Build2_0.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGL_Build2_0.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL_Build2_0.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL_Build2_0.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Plat former Game",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          
          // 【核心新增】点击全屏时，尝试强制锁定横屏
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1).then(() => {
              // 尝试调用屏幕方向 API（仅部分安卓 Chrome 支持）
              if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch((error) => {
                  console.log("浏览器不支持强制横屏，请用户手动旋转。");
                });
              }
            });
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
