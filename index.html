<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Plat former Game</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        padding: 0 !important;
        margin: 0 !important;
        overflow: hidden !important;
        background-color: #000 !important;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      
      /* 强制容器保持 16:9 比例并居中 */
      #unity-container {
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        width: 100vw !important;
        height: 56.25vw !important; 
        max-height: 100vh !important;
        max-width: 177.78vh !important; 
      }
      
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        background: #231F20;
      }
      
      #unity-footer {
        display: none !important; 
      }

      /* 【核心新增】全屏状态下的旋转引导遮罩 */
      #rotate-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: #1a1a1a;
        color: white;
        z-index: 10000;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
        text-align: center;
      }
      #rotate-overlay .phone-icon {
        font-size: 60px;
        margin-bottom: 20px;
        animation: rotate-phone 2s infinite ease-in-out;
      }
      @keyframes rotate-phone {
        0% { transform: rotate(0deg); }
        50% { transform: rotate(90deg); }
        100% { transform: rotate(90deg); }
      }

      /* 当全屏且处于竖屏时，显示遮罩 */
      #rotate-overlay.show {
        display: flex !important;
      }
    </style>
  </head>
  <body>
    <!-- 旋转引导遮罩 -->
    <div id="rotate-overlay">
      <div class="phone-icon">📱</div>
      <h2 style="margin:0; font-size: 24px;">请旋转手机</h2>
      <p style="margin-top: 10px; color: #aaa;">横屏体验更佳</p>
    </div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>

    <button id="custom-fullscreen-btn" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; padding: 8px 16px; background: rgba(255,255,255,0.7); border: none; border-radius: 5px; font-weight: bold; display: none;">全屏</button>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      var customBtn = document.querySelector("#custom-fullscreen-btn");
      var rotateOverlay = document.querySelector("#rotate-overlay");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else if (type == 'warning') {
          div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL_Build2_0.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGL_Build2_0.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL_Build2_0.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL_Build2_0.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Plat former Game",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
        customBtn.style.display = "block";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          
          // 监听全屏变化
          document.addEventListener('fullscreenchange', handleFullscreenChange);
          document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

          function handleFullscreenChange() {
            var isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            if (isFullscreen) {
              customBtn.style.display = "none"; // 隐藏自定义按钮
              checkOrientation();
            } else {
              customBtn.style.display = "block"; // 退出全屏时显示
              rotateOverlay.classList.remove("show"); // 退出全屏时隐藏遮罩
            }
          }

          // 检查当前是否是竖屏
          function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
              rotateOverlay.classList.add("show"); // 竖屏时显示遮罩
            } else {
              rotateOverlay.classList.remove("show"); // 横屏时隐藏遮罩
            }
          }

          // 监听屏幕旋转
          window.addEventListener("resize", checkOrientation);
          window.addEventListener("orientationchange", () => {
            setTimeout(checkOrientation, 100); // 延迟一点等待浏览器更新宽高
          });

          // 绑定全屏逻辑
          var toggleFullscreen = () => {
            unityInstance.SetFullscreen(1).then(() => {
              if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(()=>{});
              }
            });
          };

          customBtn.onclick = toggleFullscreen;
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
